 <linearGradient id="nose" x1="146" y1="238" x2="175" y2="238" gradientUnits="userSpaceOnUse"><stop stop-color="#060a0e"/><stop offset=".46" stop-color="#222d36"/><stop offset=".5" stop-color="#85939e"/><stop offset=".57" stop-color="#47545e"/><stop offset="1" stop-color="#12191f"/></linearGradient>
 <linearGradient id="eyes" x1="160" y1="208" x2="160" y2="246" gradientUnits="userSpaceOnUse"><stop stop-color="#fcffff"/><stop offset="1" stop-color="#b8d1de"/></linearGradient>
