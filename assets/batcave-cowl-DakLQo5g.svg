<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Batcave — маска Бэтмена</title>
<desc id="desc">Объёмная графитовая маска с длинными ушами, нахмуренными надбровными дугами, светлыми глазами и открытой нижней частью лица. Самостоятельный вектор без растровых изображений.</desc>
